name: sylla-voyage

services:
  postgres:
    image: postgres:16-alpine
    container_name: sylla_voyage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sylla_voyage_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sylla_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sylla_voyage_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: sylla_voyage_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - sylla_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: sylla-voyage-api
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sylla_voyage_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sylla_voyage_dev}?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-sylla_voyage_dev_secret_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NABOOPAY_API_KEY: ${NABOOPAY_API_KEY:-}
      NABOOPAY_WEBHOOK_SECRET: ${NABOOPAY_WEBHOOK_SECRET:-sylla_naboopay_webhook_secret_dev}
      NABOOPAY_BASE_URL: ${NABOOPAY_BASE_URL:-https://api.naboopay.com}
      BICTORYS_API_KEY: ${BICTORYS_API_KEY:-}
      BICTORYS_WEBHOOK_SECRET: ${BICTORYS_WEBHOOK_SECRET:-sylla_bictorys_webhook_secret_dev}
      BICTORYS_BASE_URL: ${BICTORYS_BASE_URL:-https://api.bictorys.com}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sylla_internal

  web:
    image: sylla-voyage-web
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: sylla_voyage_web
    restart: unless-stopped
    command: ["serve", "-s", "dist", "-l", "tcp://0.0.0.0:5173", "--no-clipboard"]
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sylla_internal

volumes:
  postgres_data:
  redis_data:

networks:
  sylla_internal:
    driver: bridge
